name: CI - Lint, TypeCheck, Test, Contract, Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run full test suite weekly on Sundays
    - cron: '0 2 * * 0'

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: "24"
  NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
  PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
  PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
  PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Drizzle schema
        run: npm run drizzle:generate

      - name: Run TypeScript compiler check
        run: npx tsc --noEmit

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: instagram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d instagram_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Drizzle schema
        run: npm run drizzle:generate

      - name: Wait for PostgreSQL to be fully ready
        run: |
          for i in {1..30}; do
            if pg_isready -U test -d instagram_test -h localhost -p 5432; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Enable PostgreSQL extensions
        run: |
          PGPASSWORD=test psql -h localhost -U test -d instagram_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run database migrations
        run: npx drizzle-kit push --force
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/instagram_test
          DATABASE_URL_UNPOOLED: postgresql://test:test@localhost:5432/instagram_test

      - name: Run unit tests
        run: npm run test -- --run
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/instagram_test
          DATABASE_URL_UNPOOLED: postgresql://test:test@localhost:5432/instagram_test
          NODE_ENV: test
          BETTER_AUTH_SECRET: test-secret-for-ci
          BETTER_AUTH_URL: http://localhost:3000
          CORS_ORIGIN: http://localhost:3000
          LOG_LEVEL: error

      - name: Upload test coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  security-audit:
    name: Security Audit (npm audit, secrets scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secrets scan

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        continue-on-error: true
        run: |
          npm audit --audit-level=high
          if [ $? -ne 0 ]; then
            echo "::warning::High severity vulnerabilities found"
            npm audit --json > audit-report.json
          fi

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        continue-on-error: true
        with:
          project: 'instagram-backend'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --suppression suppression.xml

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 30

      - name: Run GitLeaks (secrets scan)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose --redact

      - name: Run TruffleHog (secrets scan)
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: main
          head: HEAD

  contract-test:
    name: Contract Tests (Pact)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: instagram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d instagram_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL to be fully ready
        run: |
          for i in {1..30}; do
            if pg_isready -U test -d instagram_test -h localhost -p 5432; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Enable PostgreSQL extensions
        run: |
          PGPASSWORD=test psql -h localhost -U test -d instagram_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run database schema push
        run: npx drizzle-kit push --force
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/instagram_test
          DATABASE_URL_UNPOOLED: postgresql://test:test@localhost:5432/instagram_test

      - name: Debug - List database tables
        run: |
          PGPASSWORD=test psql -h localhost -U test -d instagram_test -c "\dt"
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/instagram_test
          DATABASE_URL_UNPOOLED: postgresql://test:test@localhost:5432/instagram_test

      - name: Install Pact CLI
        run: npm install -g @pact-foundation/pact-cli

      - name: Start Pact Broker
        run: |
          docker run -d --name pact-broker \
            -p 9292:9292 \
            -e PACT_BROKER_DATABASE_URL=sqlite:////tmp/pact.db \
            -e PACT_BROKER_LOG_LEVEL=DEBUG \
            pactfoundation/pact-broker:2
          # Wait for Pact Broker to be ready with retries (increased timeout)
          for i in {1..60}; do
            if curl -f http://localhost:9292/ 2>/dev/null | grep -q "Pact Broker"; then
              echo "Pact Broker is ready"
              break
            fi
            echo "Waiting for Pact Broker... ($i/60)"
            sleep 3
          done
          # Check container status and logs if not ready
          if ! curl -f http://localhost:9292/ 2>/dev/null | grep -q "Pact Broker"; then
            echo "=== Pact Broker container logs ==="
            docker logs pact-broker
            echo "=== Container status ==="
            docker ps -a --filter name=pact-broker
            exit 1
          fi

      - name: Publish consumer contracts (from consumer CI)
        run: |
          npm run pact:publish || true
        env:
          PACT_BROKER_URL: http://localhost:9292

      - name: Run provider contract verification
        run: npm run test:contract
        env:
          PACT_BROKER_URL: http://localhost:9292
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          DATABASE_URL: postgresql://test:test@localhost:5432/instagram_test
          DATABASE_URL_UNPOOLED: postgresql://test:test@localhost:5432/instagram_test
          NODE_ENV: test
          BETTER_AUTH_SECRET: test-secret-for-ci
          BETTER_AUTH_URL: http://localhost:3000
          CORS_ORIGIN: http://localhost:3000
          LOG_LEVEL: error

      - name: Upload Pact verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-verification-results
          path: pacts/
          retention-days: 7

  contract-check:
    name: Contract Check (Can I Deploy)
    runs-on: ubuntu-latest
    needs: [contract-test]
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if provider can be deployed
        run: |
          if [ -z "${{ secrets.PACT_BROKER_URL }}" ]; then
            echo "ℹ️ PACT_BROKER_URL secret is not configured."
            echo "✅ Contract verification passed in contract-test job."
            exit 0
          fi

          npm install -g @pact-foundation/pact-cli

          CMD=(
            pact broker can-i-deploy
            --pacticipant=instagram-backend
            --version="${{ github.sha }}"
            --to-environment=production
            --broker-base-url="${{ secrets.PACT_BROKER_URL }}"
            --retry-while-unknown=60
            --retry-interval=10
          )

          if [ -n "${{ secrets.PACT_BROKER_USERNAME }}" ]; then
            CMD+=(--broker-username="${{ secrets.PACT_BROKER_USERNAME }}")
          fi
          if [ -n "${{ secrets.PACT_BROKER_PASSWORD }}" ]; then
            CMD+=(--broker-password="${{ secrets.PACT_BROKER_PASSWORD }}")
          fi

          "${CMD[@]}"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Drizzle schema
        run: npm run drizzle:generate

      - name: Build TypeScript
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: instagram-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'instagram-backend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security-audit, contract-test, contract-check, build, docker-build]
    if: failure()
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#ci-alerts'
          text: "CI failed for ${{ github.repository }}@${{ github.sha }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true