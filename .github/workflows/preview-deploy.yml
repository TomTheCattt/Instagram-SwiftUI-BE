name: Preview Build & Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]

env:
  NODE_VERSION: "24"

jobs:
  preview-build:
    name: Build & Verify Preview
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Generate Drizzle schema
        run: npm run drizzle:generate

      - name: Build Application
        run: npm run build

      - name: Build Docker Image
        run: |
          docker build -t instagram-backend:preview-pr-${{ github.event.pull_request.number }} .

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 🚀 Preview Build Successful

            **PR:** #${{ github.event.pull_request.number }}
            **Docker Image:** \`instagram-backend:preview-pr-${{ github.event.pull_request.number }}\`
            **Status:** Ready for review and testing.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
